// ============================================================================
// LINEAR ALGEBRA HELPERS
// ============================================================================
const vAdd = (a, b) => a.map((x, i) => x + b[i]);
const vSub = (a, b) => a.map((x, i) => x - b[i]);
const vScale = (a, s) => a.map((x) => x * s);
const vDot = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);
const vNorm = (a) => Math.sqrt(vDot(a, a));
const vNormalize = (a) => {
  const n = vNorm(a);
  return n < 1e-12 ? a : vScale(a, 1 / n);
};

// ============================================================================
// SEPARABILITY CHECK (Perceptron)
// Hard-margin SVM only has a solution if the data is linearly separable.
// We detect this with a perceptron: if it converges, separable; if it cycles
// past a generous iteration budget, treat as non-separable.
// ============================================================================
function checkSeparable(X, y, maxIters = 800) {
  const n = X.length;
  if (n === 0) return true;
  const d = X[0].length;
  const w = new Array(d).fill(0);
  let b = 0;
  for (let it = 0; it < maxIters; it++) {
    let updated = false;
    for (let i = 0; i < n; i++) {
      if (y[i] * (vDot(w, X[i]) + b) <= 0) {
        for (let k = 0; k < d; k++) w[k] += y[i] * X[i][k];
        b += y[i];
        updated = true;
      }
    }
    if (!updated) return true;
  }
  return false;
}

// ============================================================================
// HARD-MARGIN SVM SOLVER (with iteration history)
// Solves the dual via projected gradient ascent:
//   max_α  Σ α_i − ½ Σ_ij α_i α_j y_i y_j x_i·x_j
//   s.t.   α_i ≥ 0,  Σ α_i y_i = 0
// We snapshot (w, b) at intervals so the UI can scrub through the actual
// optimization trajectory rather than interpolating between start and end.
// Features are internally standardized for numerical stability and (w, b)
// is mapped back to the original coordinate frame.
// ============================================================================
function solveSVM(X, y, opts = {}) {
  const {
    snapshots = 80,
    tol = 1e-6,
    patience = 5,
    checkEvery = 100,
    C = Infinity,
  } = opts;
  // lr=0.01 is the correct fixed step size for the dual gradient ascent
  // regardless of C — the dual gradient magnitude doesn't scale with C, so
  // larger steps just cause oscillation around the box constraints.
  // For high C with non-separable data we just need more iterations.
  const cFinite = isFinite(C) ? C : 1.0;
  const iters = opts.iters ?? (cFinite > 50 ? 30000 : 20000);
  const lr = opts.lr ?? 0.01;
  const n = X.length;
  if (n === 0) return null;
  const d = X[0].length;

  // Standardize: center and scale each feature into ~[-1, 1]
  const mean = new Array(d).fill(0);
  const scale = new Array(d).fill(1);
  for (let k = 0; k < d; k++) {
    let mn = Infinity, mx = -Infinity;
    for (let i = 0; i < n; i++) {
      if (X[i][k] < mn) mn = X[i][k];
      if (X[i][k] > mx) mx = X[i][k];
    }
    mean[k] = (mn + mx) / 2;
    scale[k] = Math.max((mx - mn) / 2, 1e-6);
  }
  const Xn = X.map((x) => x.map((v, k) => (v - mean[k]) / scale[k]));

  const alpha = new Array(n).fill(0);
  const K = [];
  for (let i = 0; i < n; i++) {
    K.push(new Array(n));
    for (let j = 0; j < n; j++) K[i][j] = y[i] * y[j] * vDot(Xn[i], Xn[j]);
  }

  // Dual objective L(α) = Σα_i − ½ Σα_i α_j y_i y_j K_ij
  const dualObj = () => {
    let s = 0, q = 0;
    for (let i = 0; i < n; i++) s += alpha[i];
    for (let i = 0; i < n; i++)
      for (let j = 0; j < n; j++) q += alpha[i] * alpha[j] * K[i][j];
    return s - 0.5 * q;
  };

  // Recover (w, b) in *original* coordinates from current α.
  // Soft-margin: 0 ≤ α_i ≤ C. Categorize SVs:
  //   - margin SV:  0 < α_i < C  (lies exactly on the margin)
  //   - slack SV:   α_i = C       (inside the margin or misclassified)
  // For b, average over MARGIN SVs (those satisfy y_i(w·x_i+b) = 1 exactly).
  const recover = () => {
    const wn = new Array(d).fill(0);
    for (let i = 0; i < n; i++) {
      if (alpha[i] > 1e-9) {
        for (let k = 0; k < d; k++) wn[k] += alpha[i] * y[i] * Xn[i][k];
      }
    }
    const Ceps = isFinite(C) ? C - 1e-6 : Infinity;
    const marginSV = [];
    const slackSV = [];
    for (let i = 0; i < n; i++) {
      if (alpha[i] > 1e-6) {
        if (alpha[i] >= Ceps) slackSV.push(i);
        else marginSV.push(i);
      }
    }
    let bn = 0;
    if (marginSV.length > 0) {
      for (const i of marginSV) bn += y[i] - vDot(wn, Xn[i]);
      bn /= marginSV.length;
    } else if (marginSV.length + slackSV.length > 0) {
      // fallback: average over all SVs (rare; happens early in iteration)
      const allSV = marginSV.concat(slackSV);
      for (const i of allSV) bn += y[i] - vDot(wn, Xn[i]);
      bn /= allSV.length;
    }
    // Map back to original space
    const w = wn.map((v, k) => v / scale[k]);
    let b = bn;
    for (let k = 0; k < d; k++) b -= w[k] * mean[k];
    const supportVectors = marginSV.concat(slackSV);
    const svType = {};
    for (const i of marginSV) svType[i] = "margin";
    for (const i of slackSV) svType[i] = "slack";
    return { w, b, supportVectors, svType };
  };

  const history = [];
  history.push({ iter: 0, w: new Array(d).fill(0), b: 0, supportVectors: [], svType: {} });

  const snapEvery = Math.max(1, Math.floor(iters / snapshots));
  let prevObj = -Infinity;
  let stagnant = 0;
  let stoppedAt = iters;
  let stopReason = "maxIters";

  for (let it = 1; it <= iters; it++) {
    const g = new Array(n);
    for (let i = 0; i < n; i++) {
      let s = 0;
      for (let j = 0; j < n; j++) s += alpha[j] * K[i][j];
      g[i] = 1 - s;
    }
    for (let i = 0; i < n; i++) alpha[i] += lr * g[i];
    // Box constraint: 0 ≤ α_i ≤ C
    for (let i = 0; i < n; i++) {
      if (alpha[i] < 0) alpha[i] = 0;
      else if (alpha[i] > C) alpha[i] = C;
    }
    // Equality projection Σα_i y_i = 0: subtract mean over the *interior* set
    // (α_i strictly between 0 and C). Box-bound α can't be moved without
    // violating their constraint, so we re-project only over the free set.
    let sumAy = 0, active = 0;
    for (let i = 0; i < n; i++) {
      if (alpha[i] > 0 && alpha[i] < C) { sumAy += alpha[i] * y[i]; active++; }
    }
    if (active > 0) {
      const adj = sumAy / active;
      for (let i = 0; i < n; i++) {
        if (alpha[i] > 0 && alpha[i] < C) {
          alpha[i] -= adj * y[i];
          if (alpha[i] < 0) alpha[i] = 0;
          else if (alpha[i] > C) alpha[i] = C;
        }
      }
    }
    if (it % snapEvery === 0 || it === iters) {
      const snap = recover();
      history.push({
        iter: it,
        w: snap.w,
        b: snap.b,
        supportVectors: snap.supportVectors,
        svType: snap.svType,
      });
    }
    // Early stopping: relative dual-objective gain < tol for `patience` checks in a row
    if (it % checkEvery === 0) {
      const obj = dualObj();
      const rel = (obj - prevObj) / Math.max(Math.abs(obj), 1e-9);
      if (rel < tol) {
        stagnant++;
        if (stagnant >= patience) {
          stoppedAt = it;
          stopReason = "converged";
          break;
        }
      } else {
        stagnant = 0;
      }
      prevObj = obj;
    }
  }

  // Ensure the final iterate is in history
  if (history[history.length - 1].iter !== stoppedAt) {
    const snap = recover();
    history.push({
      iter: stoppedAt,
      w: snap.w,
      b: snap.b,
      supportVectors: snap.supportVectors,
      svType: snap.svType,
    });
  }

  const final = history[history.length - 1];
  return {
    w: final.w,
    b: final.b,
    supportVectors: final.supportVectors,
    svType: final.svType || {},
    history,
    stoppedAt,
    stopReason,
    C,
  };
}

// ============================================================================
// AXIS-TICK HELPER (nice round numbers)
// ============================================================================
function niceTicks(min, max, count = 5) {
  const range = max - min;
  if (range <= 0) return [min];
  const rawStep = range / count;
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const norm = rawStep / mag;
  let step;
  if (norm < 1.5) step = mag;
  else if (norm < 3) step = 2 * mag;
  else if (norm < 7) step = 5 * mag;
  else step = 10 * mag;
  const ticks = [];
  const start = Math.ceil(min / step) * step;
  for (let v = start; v <= max + 1e-9; v += step) ticks.push(Math.round(v / step) * step);
  return ticks;
}

// ============================================================================
// 2D SVM CANVAS
// ============================================================================
function SVMCanvas2D({
  points,
  setPoints,
  classA,
  classB,
  featX,
  featY,
  initW,
  initB,
  setInitW,
  setInitB,
  isAnimating,
  setIsAnimating,
  animationProgress,
  setAnimationProgress,
  showSupportVectors,
  onPlaneInfo,
  tolerance,
  marginType,
  cValue,
}) {
  const svgRef = useRef(null);
  const [draggingId, setDraggingId] = useState(null);
  const [adjustingPlane, setAdjustingPlane] = useState(null); // 'angle' | 'offset' | null
  const [hoveredId, setHoveredId] = useState(null);

  const W = 600;
  const H = 500;
  const PAD = 50;

  // Compute axis bounds with padding
  const { xMin, xMax, yMin, yMax } = useMemo(() => {
    if (points.length === 0) return { xMin: 0, xMax: 8, yMin: 0, yMax: 8 };
    const xs = points.map((p) => p.features[featX]);
    const ys = points.map((p) => p.features[featY]);
    const xRange = Math.max(...xs) - Math.min(...xs);
    const yRange = Math.max(...ys) - Math.min(...ys);
    return {
      xMin: Math.min(...xs) - xRange * 0.15,
      xMax: Math.max(...xs) + xRange * 0.15,
      yMin: Math.min(...ys) - yRange * 0.15,
      yMax: Math.max(...ys) + yRange * 0.15,
    };
  }, [points, featX, featY]);

  const x2px = (x) => PAD + ((x - xMin) / (xMax - xMin)) * (W - 2 * PAD);
  const y2px = (y) => H - PAD - ((y - yMin) / (yMax - yMin)) * (H - 2 * PAD);
  const px2x = (px) => xMin + ((px - PAD) / (W - 2 * PAD)) * (xMax - xMin);
  const px2y = (py) => yMin + ((H - PAD - py) / (H - 2 * PAD)) * (yMax - yMin);

  // Filter to only the two selected classes
  const filteredPoints = useMemo(
    () => points.filter((p) => p.species === classA || p.species === classB),
    [points, classA, classB]
  );

  // Solve the SVM (non-blocking: runs after render via useEffect)
  // We store the full solver output so we can scrub through real iterations.
  const [solution, setSolution] = useState(null);
  const [separable, setSeparable] = useState(true);
  useEffect(() => {
    if (filteredPoints.length < 2) {
      setSolution(null);
      setSeparable(true);
      return;
    }
    const X = filteredPoints.map((p) => [p.features[featX], p.features[featY]]);
    const y = filteredPoints.map((p) => (p.species === classA ? 1 : -1));
    const sep = checkSeparable(X, y);
    setSeparable(sep);
    // In hard-margin mode, non-separable data has no solution — bail.
    // In soft-margin mode, the solver always has a solution.
    if (marginType === "hard" && !sep) {
      setSolution(null);
      return;
    }
    const handle = requestAnimationFrame(() => {
      setSolution(solveSVM(X, y, { snapshots: 80, tol: tolerance, C: marginType === "soft" ? cValue : Infinity }));
    });
    return () => cancelAnimationFrame(handle);
  }, [filteredPoints, featX, featY, classA, classB, tolerance, marginType, cValue]);

  // Map solution support vectors back to point IDs, and their type ("margin" | "slack")
  const svIds = useMemo(() => {
    if (!solution) return new Set();
    return new Set(solution.supportVectors.map((i) => filteredPoints[i].id));
  }, [solution, filteredPoints]);
  const svTypeById = useMemo(() => {
    const m = new Map();
    if (!solution) return m;
    for (const i of solution.supportVectors) {
      m.set(filteredPoints[i].id, solution.svType[i] || "margin");
    }
    return m;
  }, [solution, filteredPoints]);

  // Currently displayed plane: scrubs through the actual optimization history.
  // animationProgress = 0 → user's chosen starting plane
  // animationProgress = 1 → the final converged optimum
  // intermediate values → real iterates from the dual solver
  const currentPlane = useMemo(() => {
    if (!solution || !solution.history || solution.history.length < 2) {
      return { w: initW, b: initB };
    }
    const t = Math.max(0, Math.min(1, animationProgress));
    const hist = solution.history;
    // At t=0, blend smoothly from user's chosen plane to history[0] (which is zero plane)
    // Simpler: interpret t = 0 as the user's plane, t > 0 as snapshot index
    if (t === 0) return { w: initW, b: initB };
    // Map t ∈ (0, 1] to history index ∈ [0, len-1] with a slight ease so first
    // half of the slider shows the bulk of meaningful change
    const eased = 1 - Math.pow(1 - t, 2);
    const idx = Math.min(hist.length - 1, Math.floor(eased * (hist.length - 1)));
    // Blend from user's initial plane to history[idx] when idx is small,
    // so the very first iterates aren't a jump from (initW, initB) to (0, 0).
    if (idx === 0) return { w: initW, b: initB };
    return { w: hist[idx].w.slice(), b: hist[idx].b };
  }, [initW, initB, solution, animationProgress]);

  // Report the displayed plane up to the parent for the parameter table.
  useEffect(() => {
    if (!onPlaneInfo) return;
    const hist = solution && solution.history;
    let iter = 0;
    let totalIters = 0;
    if (hist && hist.length > 1) {
      totalIters = hist[hist.length - 1].iter;
      const t = Math.max(0, Math.min(1, animationProgress));
      if (t > 0) {
        const eased = 1 - Math.pow(1 - t, 2);
        const idx = Math.min(hist.length - 1, Math.floor(eased * (hist.length - 1)));
        iter = hist[idx].iter;
      }
    }
    let svCounts = null;
    if (solution) {
      let m = 0, s = 0;
      for (const i of solution.supportVectors) {
        if (solution.svType[i] === "slack") s++; else m++;
      }
      svCounts = { margin: m, slack: s };
    }
    onPlaneInfo({
      dim: 2,
      featNames: [FEATURE_NAMES[featX], FEATURE_NAMES[featY]],
      u: currentPlane.w.slice(),
      b: currentPlane.b,
      optimal: solution ? { u: solution.w.slice(), b: solution.b } : null,
      margin: solution ? 2 / vNorm(solution.w) : null,
      separable,
      iter,
      totalIters,
      stopReason: solution ? solution.stopReason : null,
      atOptimum: animationProgress >= 0.999,
      svCounts,
    });
  }, [currentPlane, solution, separable, animationProgress, featX, featY, onPlaneInfo]);

  // Animation loop
  useEffect(() => {
    if (!isAnimating) return;
    let raf;
    const start = performance.now();
    const dur = 3500;
    const tick = () => {
      const t = Math.min(1, (performance.now() - start) / dur);
      setAnimationProgress(t);
      if (t < 1) raf = requestAnimationFrame(tick);
      else setIsAnimating(false);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [isAnimating, setAnimationProgress, setIsAnimating]);

  // Compute line endpoints for a given (w, b): w·x + b = c
  const lineForLevel = (w, b, c) => {
    // w0 x + w1 y + b = c  =>  if |w1| > |w0|, parameterize by x; else by y
    const pts = [];
    if (Math.abs(w[1]) > Math.abs(w[0])) {
      const yAt = (x) => (c - b - w[0] * x) / w[1];
      pts.push([xMin, yAt(xMin)]);
      pts.push([xMax, yAt(xMax)]);
    } else if (Math.abs(w[0]) > 1e-9) {
      const xAt = (y) => (c - b - w[1] * y) / w[0];
      pts.push([xAt(yMin), yMin]);
      pts.push([xAt(yMax), yMax]);
    }
    return pts;
  };

  const decision = lineForLevel(currentPlane.w, currentPlane.b, 0);
  const margin1 = solution ? lineForLevel(currentPlane.w, currentPlane.b, 1) : null;
  const marginM1 = solution ? lineForLevel(currentPlane.w, currentPlane.b, -1) : null;

  // Show margin lines whenever we're displaying a real solver iterate
  // (i.e. animationProgress > 0). At progress=0 we show the user's chosen
  // initial plane, which has no associated ±1 margin yet.
  const showMargins = solution && animationProgress > 0.001;

  // Mouse events
  const handleMouseDown = (e, point) => {
    e.stopPropagation();
    setDraggingId(point.id);
  };

  const handleMouseMove = (e) => {
    if (!svgRef.current) return;
    const rect = svgRef.current.getBoundingClientRect();
    const px = ((e.clientX - rect.left) / rect.width) * W;
    const py = ((e.clientY - rect.top) / rect.height) * H;

    if (draggingId !== null) {
      const newX = px2x(px);
      const newY = px2y(py);
      setPoints((prev) =>
        prev.map((p) => {
          if (p.id !== draggingId) return p;
          const f = [...p.features];
          f[featX] = newX;
          f[featY] = newY;
          return { ...p, features: f };
        })
      );
      // Show the new optimum immediately when perturbing data
      if (animationProgress < 1) setAnimationProgress(1);
    } else if (adjustingPlane === "angle") {
      // Rotate w to point from screen center toward cursor
      const cx = (xMin + xMax) / 2;
      const cy = (yMin + yMax) / 2;
      const dx = px2x(px) - cx;
      const dy = px2y(py) - cy;
      const n = Math.sqrt(dx * dx + dy * dy);
      if (n > 1e-6) setInitW([dx / n, dy / n]);
    } else if (adjustingPlane === "offset") {
      // Adjust b so the line passes through cursor for current w
      const x0 = px2x(px);
      const y0 = px2y(py);
      setInitB(-(initW[0] * x0 + initW[1] * y0));
    }
  };

  const handleMouseUp = () => {
    setDraggingId(null);
    setAdjustingPlane(null);
  };

  // Keep init plane "frozen" once we start animating; reset when user taps reset
  return (
    <div style={{ position: "relative" }}>
      <svg
        ref={svgRef}
        viewBox={`0 0 ${W} ${H}`}
        style={{
          width: "100%",
          height: "auto",
          background: "var(--canvas-bg)",
          borderRadius: "4px",
          cursor: draggingId !== null ? "grabbing" : "default",
          userSelect: "none",
        }}
        onMouseMove={handleMouseMove}
        onMouseUp={handleMouseUp}
        onMouseLeave={handleMouseUp}
      >
        {/* Grid */}
        {niceTicks(xMin, xMax, 6).map((t, i) => (
          <line key={`gx${i}`} x1={x2px(t)} y1={PAD} x2={x2px(t)} y2={H - PAD} stroke="var(--grid)" strokeWidth="0.5" />
        ))}
        {niceTicks(yMin, yMax, 6).map((t, i) => (
          <line key={`gy${i}`} x1={PAD} y1={y2px(t)} x2={W - PAD} y2={y2px(t)} stroke="var(--grid)" strokeWidth="0.5" />
        ))}

        {/* Axes */}
        <line x1={PAD} y1={H - PAD} x2={W - PAD} y2={H - PAD} stroke="var(--axis)" strokeWidth="1" />
        <line x1={PAD} y1={PAD} x2={PAD} y2={H - PAD} stroke="var(--axis)" strokeWidth="1" />

        {/* Tick labels */}
        {niceTicks(xMin, xMax, 6).map((t, i) => (
          <text
            key={`tx${i}`}
            x={x2px(t)}
            y={H - PAD + 18}
            textAnchor="middle"
            fontSize="11"
            fontFamily="var(--font-mono)"
            fill="var(--text-dim)"
          >
            {t.toFixed(1)}
          </text>
        ))}
        {niceTicks(yMin, yMax, 6).map((t, i) => (
          <text
            key={`ty${i}`}
            x={PAD - 8}
            y={y2px(t) + 4}
            textAnchor="end"
            fontSize="11"
            fontFamily="var(--font-mono)"
            fill="var(--text-dim)"
          >
            {t.toFixed(1)}
          </text>
        ))}

        {/* Axis labels */}
        <text
          x={W / 2}
          y={H - 12}
          textAnchor="middle"
          fontSize="13"
          fontFamily="var(--font-display)"
          fill="var(--text)"
          fontStyle="italic"
        >
          {FEATURE_NAMES[featX]}
        </text>
        <text
          x={16}
          y={H / 2}
          textAnchor="middle"
          fontSize="13"
          fontFamily="var(--font-display)"
          fill="var(--text)"
          fontStyle="italic"
          transform={`rotate(-90 16 ${H / 2})`}
        >
          {FEATURE_NAMES[featY]}
        </text>

        {/* Margin region (shaded) */}
        {showMargins && margin1 && marginM1 && (
          <polygon
            points={`${x2px(margin1[0][0])},${y2px(margin1[0][1])} ${x2px(margin1[1][0])},${y2px(margin1[1][1])} ${x2px(marginM1[1][0])},${y2px(marginM1[1][1])} ${x2px(marginM1[0][0])},${y2px(marginM1[0][1])}`}
            fill="var(--margin-fill)"
            opacity="0.15"
          />
        )}

        {/* Margin lines */}
        {showMargins && margin1 && (
          <line
            x1={x2px(margin1[0][0])}
            y1={y2px(margin1[0][1])}
            x2={x2px(margin1[1][0])}
            y2={y2px(margin1[1][1])}
            stroke="var(--margin-line)"
            strokeWidth="1"
            strokeDasharray="4 4"
            opacity={0.7}
          />
        )}
        {showMargins && marginM1 && (
          <line
            x1={x2px(marginM1[0][0])}
            y1={y2px(marginM1[0][1])}
            x2={x2px(marginM1[1][0])}
            y2={y2px(marginM1[1][1])}
            stroke="var(--margin-line)"
            strokeWidth="1"
            strokeDasharray="4 4"
            opacity={0.7}
          />
        )}

        {/* Decision boundary — only when separable */}
        {decision.length === 2 && (
          <line
            x1={x2px(decision[0][0])}
            y1={y2px(decision[0][1])}
            x2={x2px(decision[1][0])}
            y2={y2px(decision[1][1])}
            stroke="var(--accent)"
            strokeWidth="2.5"
          />
        )}

        {/* Data points */}
        {filteredPoints.map((p) => {
          const isA = p.species === classA;
          const cx = x2px(p.features[featX]);
          const cy = y2px(p.features[featY]);
          // Show SV rings once we've scrubbed close to the optimum
          const isSV = showSupportVectors && svIds.has(p.id) && animationProgress > 0.98;
          const svKind = isSV ? svTypeById.get(p.id) : null;
          const isHovered = hoveredId === p.id;
          const isDragging = draggingId === p.id;
          return (
            <g key={p.id}>
              {isSV && svKind === "margin" && (
                <circle
                  cx={cx} cy={cy} r={11}
                  fill="none"
                  stroke="var(--sv-ring)"
                  strokeWidth="2"
                  opacity="0.9"
                />
              )}
              {isSV && svKind === "slack" && (
                <circle
                  cx={cx} cy={cy} r={11}
                  fill="none"
                  stroke="var(--warn)"
                  strokeWidth="2"
                  strokeDasharray="3 3"
                  opacity="0.9"
                />
              )}
              <circle
                cx={cx}
                cy={cy}
                r={isHovered || isDragging ? 7 : 5.5}
                fill={isA ? "var(--class-a)" : "var(--class-b)"}
                stroke="var(--canvas-bg)"
                strokeWidth="1.5"
                style={{ cursor: "grab" }}
                onMouseDown={(e) => handleMouseDown(e, p)}
                onMouseEnter={() => setHoveredId(p.id)}
                onMouseLeave={() => setHoveredId(null)}
              />
            </g>
          );
        })}

        {/* Non-separable warning */}
        {!separable && marginType === "hard" && (
          <g transform={`translate(${W / 2}, ${H / 2})`}>
            <rect x={-180} y={-40} width={360} height={80} rx={4}
              fill="var(--canvas-bg)" stroke="var(--warn)" strokeWidth="1.5" opacity="0.95" />
            <text textAnchor="middle" fontSize="13" fontFamily="var(--font-display)"
              fontStyle="italic" fill="var(--warn)" y={-8}>
              Data is not linearly separable
            </text>
            <text textAnchor="middle" fontSize="10" fontFamily="var(--font-mono)"
              fill="var(--text-dim)" y={14} letterSpacing="0.5">
              hard-margin SVM has no solution here
            </text>
            <text textAnchor="middle" fontSize="10" fontFamily="var(--font-mono)"
              fill="var(--text-dim)" y={28} letterSpacing="0.5">
              move points back, or use soft margin
            </text>
          </g>
        )}

        {/* Math overlay */}
        <g transform={`translate(${W - PAD - 8}, ${PAD + 14})`}>
          <text textAnchor="end" fontSize="11" fontFamily="var(--font-mono)" fill="var(--text-dim)">
            u · x + b = 0
          </text>
          {solution && (
            <>
              <text textAnchor="end" fontSize="10" fontFamily="var(--font-mono)" fill="var(--text-dim)" y={16}>
                margin = {(2 / vNorm(solution.w)).toFixed(3)}
              </text>
              <text textAnchor="end" fontSize="10" fontFamily="var(--font-mono)" fill="var(--text-dim)" y={32}>
                {solution.history && animationProgress > 0
                  ? `iter ${solution.history[Math.min(solution.history.length - 1,
                      Math.floor((1 - Math.pow(1 - animationProgress, 2)) * (solution.history.length - 1)))].iter} / ${solution.history[solution.history.length - 1].iter}`
                  : 'starting plane'}
              </text>
            </>
          )}
        </g>
      </svg>
    </div>
  );
}

// ============================================================================
// 3D SVM CANVAS
// Uses a manual rotation + orthographic projection for full control
// ============================================================================
function SVMCanvas3D({
  points,
  setPoints,
  classA,
  classB,
  feat3D,
  initW3,
  initB3,
  setInitW3,
  setInitB3,
  isAnimating,
  setIsAnimating,
  animationProgress,
  setAnimationProgress,
  showSupportVectors,
  onPlaneInfo,
  tolerance,
  marginType,
  cValue,
}) {
  const svgRef = useRef(null);
  const [yaw, setYaw] = useState(0.6);
  const [pitch, setPitch] = useState(0.4);
  const [draggingId, setDraggingId] = useState(null);
  const [rotating, setRotating] = useState(false);
  const [lastMouse, setLastMouse] = useState(null);
  const [hoveredId, setHoveredId] = useState(null);

  const W = 700;
  const H = 560;

  const filteredPoints = useMemo(
    () => points.filter((p) => p.species === classA || p.species === classB),
    [points, classA, classB]
  );

  // Bounds in 3D (data units)
  const { mins, maxs } = useMemo(() => {
    if (filteredPoints.length === 0)
      return { mins: [0, 0, 0], maxs: [8, 8, 8] };
    const mn = [Infinity, Infinity, Infinity];
    const mx = [-Infinity, -Infinity, -Infinity];
    for (const p of filteredPoints) {
      for (let k = 0; k < 3; k++) {
        const v = p.features[feat3D[k]];
        if (v < mn[k]) mn[k] = v;
        if (v > mx[k]) mx[k] = v;
      }
    }
    // Pad
    for (let k = 0; k < 3; k++) {
      const r = mx[k] - mn[k] || 1;
      mn[k] -= r * 0.1;
      mx[k] += r * 0.1;
    }
    return { mins: mn, maxs: mx };
  }, [filteredPoints, feat3D]);

  // Solve SVM (non-blocking, with separability check + history snapshots)
  const [solution, setSolution] = useState(null);
  const [separable, setSeparable] = useState(true);
  useEffect(() => {
    if (filteredPoints.length < 2) {
      setSolution(null);
      setSeparable(true);
      return;
    }
    const X = filteredPoints.map((p) => [
      p.features[feat3D[0]],
      p.features[feat3D[1]],
      p.features[feat3D[2]],
    ]);
    const y = filteredPoints.map((p) => (p.species === classA ? 1 : -1));
    const sep = checkSeparable(X, y);
    setSeparable(sep);
    if (marginType === "hard" && !sep) {
      setSolution(null);
      return;
    }
    const handle = requestAnimationFrame(() => {
      setSolution(solveSVM(X, y, { snapshots: 80, tol: tolerance, C: marginType === "soft" ? cValue : Infinity }));
    });
    return () => cancelAnimationFrame(handle);
  }, [filteredPoints, feat3D, classA, classB, tolerance, marginType, cValue]);

  const svIds = useMemo(() => {
    if (!solution) return new Set();
    return new Set(solution.supportVectors.map((i) => filteredPoints[i].id));
  }, [solution, filteredPoints]);
  const svTypeById = useMemo(() => {
    const m = new Map();
    if (!solution) return m;
    for (const i of solution.supportVectors) {
      m.set(filteredPoints[i].id, solution.svType[i] || "margin");
    }
    return m;
  }, [solution, filteredPoints]);

  // Scrub through real solver history; t=0 shows user's chosen starting plane
  const currentPlane = useMemo(() => {
    if (!solution || !solution.history || solution.history.length < 2) {
      return { w: initW3, b: initB3 };
    }
    const t = Math.max(0, Math.min(1, animationProgress));
    if (t === 0) return { w: initW3, b: initB3 };
    const hist = solution.history;
    const eased = 1 - Math.pow(1 - t, 2);
    const idx = Math.min(hist.length - 1, Math.floor(eased * (hist.length - 1)));
    if (idx === 0) return { w: initW3, b: initB3 };
    return { w: hist[idx].w.slice(), b: hist[idx].b };
  }, [initW3, initB3, solution, animationProgress]);

  // Report displayed plane upward for the parameter table.
  useEffect(() => {
    if (!onPlaneInfo) return;
    const hist = solution && solution.history;
    let iter = 0;
    let totalIters = 0;
    if (hist && hist.length > 1) {
      totalIters = hist[hist.length - 1].iter;
      const t = Math.max(0, Math.min(1, animationProgress));
      if (t > 0) {
        const eased = 1 - Math.pow(1 - t, 2);
        const idx = Math.min(hist.length - 1, Math.floor(eased * (hist.length - 1)));
        iter = hist[idx].iter;
      }
    }
    let svCounts = null;
    if (solution) {
      let m = 0, s = 0;
      for (const i of solution.supportVectors) {
        if (solution.svType[i] === "slack") s++; else m++;
      }
      svCounts = { margin: m, slack: s };
    }
    onPlaneInfo({
      dim: 3,
      featNames: [FEATURE_NAMES[feat3D[0]], FEATURE_NAMES[feat3D[1]], FEATURE_NAMES[feat3D[2]]],
      u: currentPlane.w.slice(),
      b: currentPlane.b,
      optimal: solution ? { u: solution.w.slice(), b: solution.b } : null,
      margin: solution ? 2 / vNorm(solution.w) : null,
      separable,
      iter,
      totalIters,
      stopReason: solution ? solution.stopReason : null,
      atOptimum: animationProgress >= 0.999,
      svCounts,
    });
  }, [currentPlane, solution, separable, animationProgress, feat3D, onPlaneInfo]);

  // Animation
  useEffect(() => {
    if (!isAnimating) return;
    let raf;
    const start = performance.now();
    const dur = 3500;
    const tick = () => {
      const t = Math.min(1, (performance.now() - start) / dur);
      setAnimationProgress(t);
      if (t < 1) raf = requestAnimationFrame(tick);
      else setIsAnimating(false);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [isAnimating, setAnimationProgress, setIsAnimating]);

  // Convert data point to centered coords in [-1,1]^3
  const toUnit = (p3) => {
    return [0, 1, 2].map((k) => {
      const span = maxs[k] - mins[k];
      return ((p3[k] - mins[k]) / span) * 2 - 1;
    });
  };
  const fromUnit = (u) => {
    return [0, 1, 2].map((k) => mins[k] + ((u[k] + 1) / 2) * (maxs[k] - mins[k]));
  };

  // Project unit-cube coords to 2D screen via yaw/pitch
  const project = useCallback(
    (u) => {
      const [x, y, z] = u;
      const cy = Math.cos(yaw),
        sy = Math.sin(yaw);
      const cp = Math.cos(pitch),
        sp = Math.sin(pitch);
      // yaw around y-axis, then pitch around x-axis
      const x1 = cy * x + sy * z;
      const z1 = -sy * x + cy * z;
      const y2 = cp * y - sp * z1;
      const z2 = sp * y + cp * z1;
      const scale = 180;
      const cx = W / 2;
      const ccy = H / 2 + 10;
      return { sx: cx + x1 * scale, sy: ccy - y2 * scale, depth: z2 };
    },
    [yaw, pitch]
  );

  // Project a data point
  const projectData = (p3) => project(toUnit(p3));

  // ----- Compute the polygon for the hyperplane intersection with the unit cube -----
  // Hyperplane in DATA space: w·x + b = c  (c = 0 for decision; ±1 for margins)
  // Convert to UNIT-cube space: x_k = mins[k] + ((u_k+1)/2)(maxs[k]-mins[k])
  // Substitute → linear in u with new (w', b')
  const planeInUnit = (w, b, c = 0) => {
    const wU = [0, 0, 0];
    let bU = b - c;
    for (let k = 0; k < 3; k++) {
      const span = (maxs[k] - mins[k]) / 2;
      wU[k] = w[k] * span;
      bU += w[k] * (mins[k] + span); // since u=0 corresponds to mins[k]+span
    }
    return { w: wU, b: bU };
  };

  // Find polygon where {w·u + b = 0} intersects the cube [-1,1]^3
  const cubeEdges = useMemo(() => {
    const verts = [];
    for (let i = 0; i < 8; i++) {
      verts.push([(i & 1) ? 1 : -1, (i & 2) ? 1 : -1, (i & 4) ? 1 : -1]);
    }
    const edges = [];
    for (let i = 0; i < 8; i++) {
      for (let j = i + 1; j < 8; j++) {
        const a = verts[i],
          b = verts[j];
        let diff = 0;
        for (let k = 0; k < 3; k++) if (a[k] !== b[k]) diff++;
        if (diff === 1) edges.push([a, b]);
      }
    }
    return edges;
  }, []);

  const planePolygon = (w, b) => {
    const f = (u) => w[0] * u[0] + w[1] * u[1] + w[2] * u[2] + b;
    const pts = [];
    for (const [a, c] of cubeEdges) {
      const fa = f(a),
        fc = f(c);
      if (fa * fc <= 0 && Math.abs(fa - fc) > 1e-9) {
        const t = fa / (fa - fc);
        pts.push([a[0] + t * (c[0] - a[0]), a[1] + t * (c[1] - a[1]), a[2] + t * (c[2] - a[2])]);
      }
    }
    if (pts.length < 3) return [];
    // Order points around centroid using projection onto a basis on the plane
    const cen = [0, 1, 2].map((k) => pts.reduce((s, p) => s + p[k], 0) / pts.length);
    const wn = vNormalize(w);
    // pick any vector not parallel to wn
    const ref = Math.abs(wn[0]) > 0.9 ? [0, 1, 0] : [1, 0, 0];
    const u1 = vNormalize(vSub(ref, vScale(wn, vDot(ref, wn))));
    const u2 = vNormalize([
      wn[1] * u1[2] - wn[2] * u1[1],
      wn[2] * u1[0] - wn[0] * u1[2],
      wn[0] * u1[1] - wn[1] * u1[0],
    ]);
    const angles = pts.map((p) => {
      const d = vSub(p, cen);
      return Math.atan2(vDot(d, u2), vDot(d, u1));
    });
    const ordered = pts
      .map((p, i) => ({ p, a: angles[i] }))
      .sort((a, b) => a.a - b.a)
      .map((o) => o.p);
    return ordered;
  };

  const decisionInUnit = planeInUnit(currentPlane.w, currentPlane.b, 0);
  const decisionPoly = useMemo(
    () => planePolygon(decisionInUnit.w, decisionInUnit.b),
    [decisionInUnit.w, decisionInUnit.b]
  );

  const showMargins = solution && animationProgress > 0.001;
  const margin1Unit = showMargins ? planeInUnit(currentPlane.w, currentPlane.b, 1) : null;
  const marginM1Unit = showMargins ? planeInUnit(currentPlane.w, currentPlane.b, -1) : null;
  const marginPoly1 = margin1Unit ? planePolygon(margin1Unit.w, margin1Unit.b) : [];
  const marginPolyM1 = marginM1Unit ? planePolygon(marginM1Unit.w, marginM1Unit.b) : [];

  // Cube edges for axis frame
  const projectedEdges = cubeEdges.map(([a, b]) => ({
    a: project(a),
    b: project(b),
  }));

  // Sort points by depth so back ones render first
  const sortedPoints = useMemo(() => {
    return filteredPoints
      .map((p) => {
        const u = toUnit([p.features[feat3D[0]], p.features[feat3D[1]], p.features[feat3D[2]]]);
        const proj = project(u);
        return { p, proj };
      })
      .sort((a, b) => a.proj.depth - b.proj.depth);
  }, [filteredPoints, feat3D, mins, maxs, project]);

  // Mouse handling
  const handleMouseDown = (e) => {
    const rect = svgRef.current.getBoundingClientRect();
    const px = ((e.clientX - rect.left) / rect.width) * W;
    const py = ((e.clientY - rect.top) / rect.height) * H;
    setLastMouse({ x: px, y: py });
    if (draggingId === null) setRotating(true);
  };

  const handleMouseDownPoint = (e, p) => {
    e.stopPropagation();
    setDraggingId(p.id);
    const rect = svgRef.current.getBoundingClientRect();
    const px = ((e.clientX - rect.left) / rect.width) * W;
    const py = ((e.clientY - rect.top) / rect.height) * H;
    setLastMouse({ x: px, y: py });
  };

  const handleMouseMove = (e) => {
    if (!svgRef.current || !lastMouse) return;
    const rect = svgRef.current.getBoundingClientRect();
    const px = ((e.clientX - rect.left) / rect.width) * W;
    const py = ((e.clientY - rect.top) / rect.height) * H;
    const dx = px - lastMouse.x;
    const dy = py - lastMouse.y;

    if (rotating && draggingId === null) {
      setYaw((y) => y + dx * 0.008);
      setPitch((p) => Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, p + dy * 0.008)));
    } else if (draggingId !== null) {
      // Drag in the screen-aligned plane: convert pixel delta to data delta
      // Move along screen X (which mostly affects x,z in data) and screen Y (which affects y)
      // We'll compute screen-space basis vectors mapped back to data coords.
      // For simplicity: invert the projection by solving for movement along world axes that produces the screen delta.
      // Use small finite differences.
      const cur = points.find((pp) => pp.id === draggingId);
      if (cur) {
        const f = [...cur.features];
        const cur3 = [f[feat3D[0]], f[feat3D[1]], f[feat3D[2]]];
        const u = toUnit(cur3);
        const eps = 0.01;
        const baseProj = project(u);
        // Build Jacobian: 3x2 (data axes -> screen)
        const J = [[], [], []];
        for (let k = 0; k < 3; k++) {
          const u2 = [...u];
          u2[k] += eps;
          const p2 = project(u2);
          J[k] = [(p2.sx - baseProj.sx) / eps, (p2.sy - baseProj.sy) / eps];
        }
        // We want to find Δu such that J^T Δu ≈ (dx, dy). Use least squares (J J^T) Δu = J·(dx,dy)
        // J is 3x2 (rows = axes)
        // Construct A (3x3) = J J^T, rhs = J · [dx,dy]
        const A = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];
        const rhs = [0, 0, 0];
        for (let i = 0; i < 3; i++) {
          for (let j = 0; j < 3; j++) {
            A[i][j] = J[i][0] * J[j][0] + J[i][1] * J[j][1];
          }
          rhs[i] = J[i][0] * dx + J[i][1] * dy;
        }
        // Add regularization to handle rank-deficient (always rank 2)
        for (let i = 0; i < 3; i++) A[i][i] += 0.001;
        // Solve 3x3
        const det =
          A[0][0] * (A[1][1] * A[2][2] - A[1][2] * A[2][1]) -
          A[0][1] * (A[1][0] * A[2][2] - A[1][2] * A[2][0]) +
          A[0][2] * (A[1][0] * A[2][1] - A[1][1] * A[2][0]);
        if (Math.abs(det) > 1e-9) {
          const inv = [
            [
              (A[1][1] * A[2][2] - A[1][2] * A[2][1]) / det,
              -(A[0][1] * A[2][2] - A[0][2] * A[2][1]) / det,
              (A[0][1] * A[1][2] - A[0][2] * A[1][1]) / det,
            ],
            [
              -(A[1][0] * A[2][2] - A[1][2] * A[2][0]) / det,
              (A[0][0] * A[2][2] - A[0][2] * A[2][0]) / det,
              -(A[0][0] * A[1][2] - A[0][2] * A[1][0]) / det,
            ],
            [
              (A[1][0] * A[2][1] - A[1][1] * A[2][0]) / det,
              -(A[0][0] * A[2][1] - A[0][1] * A[2][0]) / det,
              (A[0][0] * A[1][1] - A[0][1] * A[1][0]) / det,
            ],
          ];
          const du = [
            inv[0][0] * rhs[0] + inv[0][1] * rhs[1] + inv[0][2] * rhs[2],
            inv[1][0] * rhs[0] + inv[1][1] * rhs[1] + inv[1][2] * rhs[2],
            inv[2][0] * rhs[0] + inv[2][1] * rhs[1] + inv[2][2] * rhs[2],
          ];
          // Note: dy in screen is inverted (y down). The Jacobian already accounts via project's sy = ccy - y2*scale
          // But our delta dy from the mouse is in screen coords too (down positive), so this should work.
          const newU = [u[0] + du[0], u[1] + du[1], u[2] + du[2]];
          // Clip to cube
          for (let k = 0; k < 3; k++) newU[k] = Math.max(-1.05, Math.min(1.05, newU[k]));
          const newData = fromUnit(newU);
          setPoints((prev) =>
            prev.map((pp) => {
              if (pp.id !== draggingId) return pp;
              const nf = [...pp.features];
              nf[feat3D[0]] = newData[0];
              nf[feat3D[1]] = newData[1];
              nf[feat3D[2]] = newData[2];
              return { ...pp, features: nf };
            })
          );
          if (animationProgress < 1) setAnimationProgress(1);
        }
      }
    }
    setLastMouse({ x: px, y: py });
  };

  const handleMouseUp = () => {
    setRotating(false);
    setDraggingId(null);
    setLastMouse(null);
  };

  // Project + draw plane polygon
  const drawPoly = (poly, fill, stroke, opacity = 0.18) => {
    if (poly.length < 3) return null;
    const pts = poly.map((u) => project(u));
    return (
      <polygon
        points={pts.map((p) => `${p.sx},${p.sy}`).join(" ")}
        fill={fill}
        stroke={stroke}
        strokeWidth="1.2"
        opacity={opacity}
      />
    );
  };

  // Axis labels at cube corners
  const xAxisEnd = project([1, -1, -1]);
  const yAxisEnd = project([-1, 1, -1]);
  const zAxisEnd = project([-1, -1, 1]);
  const origin = project([-1, -1, -1]);

  return (
    <div style={{ position: "relative" }}>
      <svg
        ref={svgRef}
        viewBox={`0 0 ${W} ${H}`}
        style={{
          width: "100%",
          height: "auto",
          background: "var(--canvas-bg)",
          borderRadius: "4px",
          cursor: rotating ? "grabbing" : draggingId !== null ? "grabbing" : "grab",
          userSelect: "none",
          touchAction: "none",
        }}
        onMouseDown={handleMouseDown}
        onMouseMove={handleMouseMove}
        onMouseUp={handleMouseUp}
        onMouseLeave={handleMouseUp}
      >
        {/* Cube frame */}
        {projectedEdges.map((e, i) => (
          <line
            key={i}
            x1={e.a.sx}
            y1={e.a.sy}
            x2={e.b.sx}
            y2={e.b.sy}
            stroke="var(--grid)"
            strokeWidth="0.7"
            opacity="0.5"
          />
        ))}

        {/* Axis indicators */}
        <line x1={origin.sx} y1={origin.sy} x2={xAxisEnd.sx} y2={xAxisEnd.sy} stroke="var(--axis)" strokeWidth="1.5" />
        <line x1={origin.sx} y1={origin.sy} x2={yAxisEnd.sx} y2={yAxisEnd.sy} stroke="var(--axis)" strokeWidth="1.5" />
        <line x1={origin.sx} y1={origin.sy} x2={zAxisEnd.sx} y2={zAxisEnd.sy} stroke="var(--axis)" strokeWidth="1.5" />
        <text
          x={xAxisEnd.sx + 8}
          y={xAxisEnd.sy + 4}
          fontSize="11"
          fontFamily="var(--font-display)"
          fontStyle="italic"
          fill="var(--text)"
        >
          {FEATURE_NAMES[feat3D[0]]}
        </text>
        <text
          x={yAxisEnd.sx - 4}
          y={yAxisEnd.sy - 6}
          fontSize="11"
          fontFamily="var(--font-display)"
          fontStyle="italic"
          fill="var(--text)"
          textAnchor="end"
        >
          {FEATURE_NAMES[feat3D[1]]}
        </text>
        <text
          x={zAxisEnd.sx - 4}
          y={zAxisEnd.sy + 14}
          fontSize="11"
          fontFamily="var(--font-display)"
          fontStyle="italic"
          fill="var(--text)"
          textAnchor="end"
        >
          {FEATURE_NAMES[feat3D[2]]}
        </text>

        {/* Margin polygons (behind decision) */}
        {marginPolyM1.length > 0 && drawPoly(marginPolyM1, "var(--margin-fill)", "var(--margin-line)", 0.12)}
        {marginPoly1.length > 0 && drawPoly(marginPoly1, "var(--margin-fill)", "var(--margin-line)", 0.12)}

        {/* Decision plane — only when separable */}
        {decisionPoly.length > 0 && drawPoly(decisionPoly, "var(--accent)", "var(--accent)", 0.28)}

        {/* Points (depth-sorted) */}
        {sortedPoints.map(({ p, proj }) => {
          const isA = p.species === classA;
          const isSV = showSupportVectors && svIds.has(p.id) && animationProgress > 0.98;
          const svKind = isSV ? svTypeById.get(p.id) : null;
          const isHovered = hoveredId === p.id;
          const isDragging = draggingId === p.id;
          // Depth-based size + opacity
          const depthFactor = (proj.depth + 1.5) / 3; // ~0..1
          const r = (isHovered || isDragging ? 8 : 6) * (0.7 + 0.3 * depthFactor);
          return (
            <g key={p.id}>
              {isSV && svKind === "margin" && (
                <circle
                  cx={proj.sx} cy={proj.sy} r={r + 5}
                  fill="none"
                  stroke="var(--sv-ring)"
                  strokeWidth="2"
                  opacity="0.9"
                />
              )}
              {isSV && svKind === "slack" && (
                <circle
                  cx={proj.sx} cy={proj.sy} r={r + 5}
                  fill="none"
                  stroke="var(--warn)"
                  strokeWidth="2"
                  strokeDasharray="3 3"
                  opacity="0.9"
                />
              )}
              <circle
                cx={proj.sx}
                cy={proj.sy}
                r={r}
                fill={isA ? "var(--class-a)" : "var(--class-b)"}
                stroke="var(--canvas-bg)"
                strokeWidth="1.5"
                opacity={0.6 + 0.4 * depthFactor}
                style={{ cursor: "grab" }}
                onMouseDown={(e) => handleMouseDownPoint(e, p)}
                onMouseEnter={() => setHoveredId(p.id)}
                onMouseLeave={() => setHoveredId(null)}
              />
            </g>
          );
        })}

        {/* Non-separable warning */}
        {!separable && marginType === "hard" && (
          <g transform={`translate(${W / 2}, ${H / 2})`}>
            <rect x={-180} y={-40} width={360} height={80} rx={4}
              fill="var(--canvas-bg)" stroke="var(--warn)" strokeWidth="1.5" opacity="0.95" />
            <text textAnchor="middle" fontSize="13" fontFamily="var(--font-display)"
              fontStyle="italic" fill="var(--warn)" y={-8}>
              Data is not linearly separable
            </text>
            <text textAnchor="middle" fontSize="10" fontFamily="var(--font-mono)"
              fill="var(--text-dim)" y={14} letterSpacing="0.5">
              hard-margin SVM has no solution here
            </text>
            <text textAnchor="middle" fontSize="10" fontFamily="var(--font-mono)"
              fill="var(--text-dim)" y={28} letterSpacing="0.5">
              move points back, or use soft margin
            </text>
          </g>
        )}

        {/* Math overlay */}
        <g transform={`translate(${W - 16}, 24)`}>
          <text textAnchor="end" fontSize="11" fontFamily="var(--font-mono)" fill="var(--text-dim)">
            u · x + b = 0
          </text>
          {solution && (
            <>
              <text textAnchor="end" fontSize="10" fontFamily="var(--font-mono)" fill="var(--text-dim)" y={16}>
                margin = {(2 / vNorm(solution.w)).toFixed(3)}
              </text>
              <text textAnchor="end" fontSize="10" fontFamily="var(--font-mono)" fill="var(--text-dim)" y={32}>
                {solution.history && animationProgress > 0
                  ? `iter ${solution.history[Math.min(solution.history.length - 1,
                      Math.floor((1 - Math.pow(1 - animationProgress, 2)) * (solution.history.length - 1)))].iter} / ${solution.history[solution.history.length - 1].iter}`
                  : 'starting plane'}
              </text>
            </>
          )}
          <text textAnchor="end" fontSize="9" fontFamily="var(--font-mono)" fill="var(--text-dim)" y={50}>
            drag empty space to rotate
          </text>
        </g>
      </svg>
    </div>
  );
}

// ============================================================================
// EDITABLE NUMERIC INPUT
// Holds local string state while editing so partial inputs ("1." or "-")
// don't get clobbered. Commits to parent on blur or Enter.
// ============================================================================
function ParamInput({ value, onCommit }) {
  const [editing, setEditing] = useState(false);
  const [text, setText] = useState("");
  const display = editing ? text : value.toFixed(4);
  return (
    <input
      type="text"
      inputMode="decimal"
      className="svm-params-input"
      value={display}
      onFocus={(e) => {
        setEditing(true);
        setText(value.toFixed(4));
        e.target.select();
      }}
      onChange={(e) => setText(e.target.value)}
      onBlur={() => {
        const v = parseFloat(text);
        if (!Number.isNaN(v) && Math.abs(v - value) > 1e-9) onCommit(v);
        setEditing(false);
      }}
      onKeyDown={(e) => {
        if (e.key === "Enter") e.target.blur();
        else if (e.key === "Escape") {
          setText(value.toFixed(4));
          setEditing(false);
          e.target.blur();
        }
      }}
    />
  );
}

            )}
            {planeInfo && planeInfo.optimal && planeInfo.totalIters > 0 && (
              <div className="svm-params-iter">
                {planeInfo.iter === 0
                  ? "starting plane (user-chosen)"
                  : planeInfo.atOptimum && planeInfo.stopReason === "converged"
                    ? `converged at iter ${planeInfo.totalIters}`
                    : planeInfo.atOptimum
                      ? `stopped at iter ${planeInfo.totalIters} (max)`
                      : `solver iter ${planeInfo.iter} / ${planeInfo.totalIters}`}
              </div>
            )}
          </div>

          <div className="svm-panel">
            <h3>
              <span className="num">06</span>RESET
            </h3>
            <button className="svm-button secondary" onClick={reset} style={{ width: "100%" }}>
              Restore Original Iris Data
            </button>
          </div>

          <div className="svm-tip">
            <strong>Try this</strong>
            {marginType === "hard"
              ? "Animate to the optimum, then drag a non-support-vector point — the boundary doesn't move (as long as the point stays on its side of its margin line). Now drag a support vector and the whole thing re-optimizes."
              : "Pick versicolor + virginica (which overlap), then sweep C from 0.01 to 1000 and watch the margin tighten as the slack SVs vanish. At low C the boundary tolerates many violations; at high C it fights to classify everything."}
          </div>
        </div>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<SVMTool />);
</script>
</body>
</html>
